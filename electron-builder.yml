appId: io.github.jsposu.paccbd
productName: PACC-BD
copyright: Copyright © 2026 osakari
directories:
  output: release
files:
  - dist/**/*
  - build/server/**/*
  - build/icons/**/*
  - electron/**/*
  - package.json
  - THIRD_PARTY_NOTICES.md
  - '!**/*.map'
asar: true
linux:
  syncDesktopName: true
  target:
    - AppImage
  category: Game
  icon: build/icons
  artifactName: PACC-BD-${version}-linux-${arch}.${ext}
win:
  target:
    - portable
  icon: build/icons/icon.ico
  artifactName: PACC-BD-${version}-windows-${arch}-portable.${ext}
portable:
  requestExecutionLevel: user
