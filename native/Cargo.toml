[package]
name = "pacc-bd-native"
version = "3.0.0-rc.1"
edition = "2024"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
slint = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "software-renderer-path", "image-default-formats", "compat-1-18", "accessibility", "unstable-fontique-012"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
tempfile = "3"
zip = { version = "=9.8.1", default-features = false, features = ["deflate"] }
fs2 = "0.4"
webbrowser = "1"

[build-dependencies]
slint-build = "=1.19.0"

[profile.release]
lto = "thin"
strip = true

# Keep iterative runs usable; unoptimized image decoding/software compositing is
# not representative of native performance. Full release builds remain faster.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
