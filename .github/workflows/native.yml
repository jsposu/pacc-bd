name: Rust native prototype

on:
  push:
    branches: [rust-rewrite]
    paths: ['native/**', 'public/panama-accuracy-flag.png', '.github/workflows/native.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native UI smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libwayland-client0
          xvfb-run -a cargo run --locked -- --smoke-test --data-dir "${{ runner.temp }}/pacc-rust-smoke"
        env:
          SLINT_BACKEND: winit-software
      - name: Native UI smoke test (Windows)
        if: runner.os == 'Windows'
        run: cargo run --locked -- --smoke-test --data-dir "${{ runner.temp }}/pacc-rust-smoke"
        env:
          SLINT_BACKEND: winit-software
      - name: Large-list scroll regression (Linux software fallback)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run --locked -- --scroll-test --data-dir "${{ runner.temp }}/pacc-rust-scroll"
        env:
          SLINT_BACKEND: winit-software
          SLINT_SCALE_FACTOR: '1'
