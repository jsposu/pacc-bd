name: Build and release desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-portable
          - os: windows-2022
            artifact: windows-portable
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npm test
      - name: Package Linux
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check packaged Linux app
        if: runner.os == 'Linux'
        run: |
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          xvfb-run -a release/linux-unpacked/pacc-bd --no-sandbox --smoke-test
        env:
          PACC_BD_DATA_DIR: ${{ runner.temp }}/pacc-smoke
      - name: Check Windows portable launcher and data location
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portable = @(Get-ChildItem 'release/*-portable.exe')
          if ($portable.Count -ne 1) { throw 'Expected exactly one Windows portable executable.' }
          $folder = Join-Path $env:RUNNER_TEMP 'PACC portable smoke'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $exe = Join-Path $folder $portable[0].Name
          Copy-Item $portable[0].FullName $exe
          Remove-Item Env:PACC_BD_DATA_DIR, Env:PANAMA_MAPS_DATA_DIR, Env:AIMTHMUS_DATA_DIR -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if (!(Test-Path (Join-Path $folder 'PACC-BD-data/electron/logs'))) { throw 'Portable data was not created beside the executable.' }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*-portable.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-portable'
          path: artifacts
          merge-multiple: true
      - name: Publish tested portable apps and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum *.AppImage *-portable.exe > SHA256SUMS
          gh release create "$TAG" *.AppImage *-portable.exe SHA256SUMS --title "PACC-BD $TAG" --generate-notes
