name: Build and release desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-installers
          - os: windows-2022
            artifact: windows-installer
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npm test
      - name: Package Linux
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a release/linux-unpacked/pacc-bd --no-sandbox --smoke-test
        env:
          PACC_BD_DATA_DIR: ${{ runner.temp }}/pacc-smoke
      - name: Check packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PACC_BD_DATA_DIR = Join-Path $env:RUNNER_TEMP 'pacc-smoke'
          & 'release/win-unpacked/PACC-BD.exe' --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*-setup.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer*'
          path: artifacts
          merge-multiple: true
      - name: Publish tested installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum *.AppImage *.deb *-setup.exe > SHA256SUMS
          gh release create "$TAG" *.AppImage *.deb *-setup.exe SHA256SUMS --title "PACC-BD $TAG" --generate-notes
